name: Benchmarking

on:
    push:
        branches:
            - "master"
            - "develop"
    pull_request:
        types: [ready_for_review, synchronize, opened]

permissions:
  contents: read

jobs:
    benchmark:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24]

        steps:
            - uses: actions/checkout@v4
            - name: Cache node modules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node24-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: ${{ runner.os }}-node24-

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  check-latest: true

            - name: Install & Build
              run: yarn setup

            - name: Benchmark
              run: yarn bench
